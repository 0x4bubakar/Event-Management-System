{% extends "layout-admin.html" %}
{% block page_header %}Venue Management{% endblock %}

{% block admin_content %}
<section class="dash-section">    
    <div class="create-container">
        <form method="POST" action="{{ url_for('admin.create_location_route') }}">
            <div style="display: flex; gap: 1rem;">
                <div class="create-group" style="flex: 2;">
                    <label>Venue Name</label>
                    <input type="text" name="venue_name" class="admin-input" placeholder="e.g. The Grand Hall" required>
                </div>
                <div class="create-group" style="flex: 1;">
                    <label>Capacity</label>
                    <input type="number" name="capacity" class="admin-input" placeholder="e.g. 150" min="1" required>
                </div>
            </div>

            <div class="create-group">
                <label>Address</label>
                <input type="text" name="address" class="admin-input" placeholder="Full Address" required>
            </div>

            <div class="create-group" style="margin: 15px 0;">
                <label>Suitable for categories:</label>
                {% if cats %}
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem;">
                        {% for cat in cats %}
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-weight: normal;">
                                <input type="checkbox" name="suitabilities" value="{{ cat.category_id }}"> 
                                {{ cat.category_name }}
                            </label>
                        {% endfor %}
                    </div>
                {% else %}
                    <p style="color: #666; font-style: italic;">You have no categories! Create some before assigning suitabilities.</p>
                {% endif %}
            </div>

            <div class="create-actions">
                <button type="submit" class="blue-btn">Save Venue</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
