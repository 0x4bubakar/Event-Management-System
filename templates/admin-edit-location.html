{% extends "layout-admin.html" %}
{% block page_header %}Edit Venue{% endblock %}

{% block admin_content %}
<section class="dash-section">

    <div class="create-container">
        <form method="POST" action="{{ url_for('admin.edit_location_route', location_id=loc.location_id) }}">
            
            <div style="display: flex; gap: 1rem;">
                <div class="create-group" style="flex: 2;">
                    <label for="venue_name">Venue Name</label>
                    <input type="text" id="venue_name" name="venue_name" class="admin-input" value="{{ loc.name }}" required>
                </div>

                <div class="create-group" style="flex: 1;">
                    <label for="capacity">Capacity</label>
                    <input type="number" id="capacity" name="capacity" class="admin-input" value="{{ loc.capacity }}" min="1" required>
                </div>
            </div>

            <div class="create-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" class="admin-input" value="{{ loc.address }}" required>
            </div>

            <div class="create-group" style="margin: 15px 0;">
                <label>Suitable for categories:</label>
                {% if cats %}
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem;">
                        {% for cat in cats %}
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-weight: normal;">
                                <input type="checkbox" name="suitabilities" value="{{ cat.category_id }}" 
                                {% if cat.category_id in current_suits %}checked{% endif %}> 
                                {{ cat.category_name }}
                            </label>
                        {% endfor %}
                    </div>
                {% else %}
                    <p style="color: #666; font-style: italic;">You have no categories! Create some before assigning suitabilities.</p>
                {% endif %}
            </div>

            <div class="create-actions">
                <button type="submit" class="blue-btn">Save Changes</button>
                <a href="{{ url_for('admin.locations_route') }}" class="red-btn" style="text-decoration: none;">Cancel</a>
            </div>
            
        </form>
    </div>
</section>
{% endblock %}
